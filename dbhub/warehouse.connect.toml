# Configuration DbHub pour un compte personnel (Codex, Claude, tout client MCP).
# Le DSN est construit par scripts/warehouse_connect.py à partir du fichier
# d'identifiants local; aucun secret n'est écrit ici ni passé en argument.
[[sources]]
id = "neolab"
description = "Warehouse NeoLab (lecture seule) : mesures et annotations du plancton et de l'océan en Arctique canadien (Baie de Baffin, détroit de Davis, mer du Labrador, baie d'Hudson…) — EcoTaxa (objets, taxons, statut d'annotation, tailles), UVP/EcoPart (profils, abondances), CTD Amundsen (température, salinité, densité sigma-t, oxygène, nitrate, fluorescence, pH), zones maritimes. Toute question sur ces données se répond avec ces outils, jamais de mémoire. Commencer par warehouse_context(topic=overview); droits dans catalogue.my_access."
dsn = "${WAREHOUSE_DSN}"
search_path = "explore,catalogue"
query_timeout = 30
connection_timeout = 5

[[tools]]
name = "execute_sql"
source = "neolab"
readonly = true
max_rows = 1000

[[tools]]
name = "search_objects"
source = "neolab"

[[tools]]
name = "warehouse_context"
source = "neolab"
description = "Lire en premier topic=overview pour le contexte métier NeoLab, puis topic=nom_de_vue pour grain, clés, limites, exemple SQL et colonnes réelles (column_list). overview donne les colonnes de toutes les vues : n'écrire du SQL qu'avec ces noms, jamais deviner. Votre périmètre de lecture (contrats, zones, années) est dans catalogue.my_access, et l'accès par jeu de données (complet, partiel, aucun, et la raison) dans catalogue.my_datasets; les jeux de données décrits, même hors de votre périmètre, sont dans catalogue.dataset_catalog; la complétude FAIR dans catalogue.fair_readiness. Avant un graphique, lire topic=graphs. topic=all donne toutes les fiches. Un catalogue existant ne prouve pas la présence de données, et un résultat vide peut signifier un accès limité."
readonly = true
max_rows = 100
statement = "SELECT topic,purpose,grain,relations,caveats,sql_example,column_list FROM catalogue.warehouse_context WHERE topic=COALESCE($1::text,'overview') OR $1::text='all' ORDER BY topic"

[[tools.parameters]]
name = "topic"
type = "string"
description = "overview (défaut), graphs (règles de graphiques), all, ou nom de vue sans préfixe explore."
required = false
