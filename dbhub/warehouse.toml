# Secrets fournis uniquement par l'environnement du lanceur.
[[sources]]
id = "neolab"
description = "Warehouse NeoLab (lecture seule) : mesures et annotations du plancton et de l'océan en Arctique canadien (Baie de Baffin, détroit de Davis, mer du Labrador, baie d'Hudson…) — EcoTaxa (objets, taxons, statut d'annotation, tailles), UVP/EcoPart (profils, abondances), CTD Amundsen (température, salinité, densité sigma-t, oxygène, nitrate, fluorescence, pression; pH pour quelques profils de 2011 seulement), zones maritimes. Toute question sur ces données se répond avec ces outils, jamais de mémoire. Commencer par warehouse_context(topic=overview); droits dans catalogue.my_access."
type = "postgres"
host = "${WAREHOUSE_READER_HOST}"
port = 55432
database = "neolab_warehouse"
user = "warehouse_reader"
password = "${WAREHOUSE_READER_PASSWORD}"
sslmode = "disable"
search_path = "explore,catalogue"
query_timeout = 30
connection_timeout = 5

[[tools]]
name = "execute_sql"
source = "neolab"
readonly = true
max_rows = 1000

[[tools]]
name = "search_objects"
source = "neolab"

[[tools]]
name = "warehouse_context"
source = "neolab"
description = "Lire en premier topic=overview pour le contexte métier NeoLab, puis topic=nom_de_vue pour grain, clés, limites, exemple SQL et colonnes réelles (column_list). overview donne les colonnes de toutes les vues : n'écrire du SQL qu'avec ces noms, jamais deviner. Avant un graphique, lire topic=graphs : bibliothèques Python, style, unités, confiance, provenance et exports. topic=all donne toutes les fiches. Consulter catalogue.warehouse_dictionary pour les colonnes/types/transformations et catalogue.dataset_versions pour les versions réellement enregistrées. Un catalogue existant ne prouve pas la présence de données."
readonly = true
max_rows = 100
statement = "SELECT topic,purpose,grain,relations,caveats,sql_example,column_list FROM catalogue.warehouse_context WHERE topic=COALESCE($1::text,'overview') OR $1::text='all' ORDER BY topic"

[[tools.parameters]]
name = "topic"
type = "string"
description = "overview (défaut), graphs (règles de graphiques), all, ou nom de vue sans préfixe explore."
required = false

[[tools]]
name = "search_documents"
source = "neolab"
description = "Chercher dans les documents écrits du warehouse (protocoles, notes de méthode, rapports, publications) : renvoie doc_key, section, un extrait et un score. Pour une question de méthode, de protocole, d'unité ou de provenance, chercher ici avant de répondre, puis lire la section avec read_document et citer doc_key et section. Liste complète : catalogue.documents."
readonly = true
max_rows = 25
statement = "SELECT doc_key,title,ordinal AS section,heading,excerpt,round(rank::numeric,3) AS score FROM catalogue.search_documents($1, 8)"

[[tools.parameters]]
name = "query"
type = "string"
description = "Mots à chercher (français ou anglais, avec ou sans accents), ex. « volume filtré débitmètre » ou « mesh size »; guillemets pour une expression exacte."
required = true

[[tools]]
name = "read_document"
source = "neolab"
description = "Lire un document du warehouse, six sections à la fois dans l'ordre d'origine (doc_key donné par search_documents ou catalogue.documents). total_sections indique s'il faut continuer avec from_section. Citer le doc_key et le numéro de section utilisés."
readonly = true
max_rows = 6
statement = "SELECT section,total_sections,heading,body FROM catalogue.read_document($1, $2::integer)"

[[tools.parameters]]
name = "doc_key"
type = "string"
description = "Clé du document, ex. filet-export-review."
required = true

[[tools.parameters]]
name = "from_section"
type = "integer"
description = "Première section à lire (défaut 1); continuer avec la suivante tant que section < total_sections."
required = false
