services:
  neolab-warehouse-db:
    image: postgis/postgis:16-3.4
    container_name: neolab-warehouse-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${WAREHOUSE_POSTGRES_DB:-neolab_warehouse}
      POSTGRES_USER: ${WAREHOUSE_POSTGRES_USER:-neolab}
      POSTGRES_PASSWORD: ${WAREHOUSE_POSTGRES_PASSWORD:?set WAREHOUSE_POSTGRES_PASSWORD in .env.warehouse}
      WAREHOUSE_READER_PASSWORD: ${WAREHOUSE_READER_PASSWORD:?set WAREHOUSE_READER_PASSWORD in .env.warehouse}
      WAREHOUSE_NAVIGATOR_PASSWORD: ${WAREHOUSE_NAVIGATOR_PASSWORD:?set WAREHOUSE_NAVIGATOR_PASSWORD in .env.warehouse}
    ports:
      - "${WAREHOUSE_POSTGRES_PORT:-55432}:5432"
    volumes:
      - neolab_warehouse_pgdata:/var/lib/postgresql/data
      - ./docs/warehouse_schema_proposal.sql:/docker-entrypoint-initdb.d/001_warehouse_schema.sql:ro
      - ./docs/warehouse_metadata_migration.sql:/docker-entrypoint-initdb.d/002_warehouse_metadata.sql:ro
      - ./docs/warehouse_ecopart_migration.sql:/docker-entrypoint-initdb.d/003_warehouse_ecopart.sql:ro
      - ./docs/warehouse_ctd_zone_migration.sql:/docker-entrypoint-initdb.d/004_warehouse_ctd_zone.sql:ro
      - ./docs/warehouse_fair_migration.sql:/docker-entrypoint-initdb.d/005_warehouse_fair.sql:ro
      - ./docs/warehouse_access_control.sql:/docker-entrypoint-initdb.d/006_warehouse_access.sql:ro
      - ./docs/warehouse_roles.sql:/opt/warehouse/warehouse_roles.sql:ro
      - ./docker/warehouse_init_roles.sh:/docker-entrypoint-initdb.d/007_warehouse_roles.sh:ro
    # Ready only after the init scripts: the entrypoint's temporary server
    # listens on the Unix socket alone, so a TCP probe waits for the real start.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 60

  # One-shot: publishes the MCP context (warehouse_context, dictionary, comments)
  # that DbHub and agents read. Rerun after a schema change:
  #   docker compose --env-file .env.warehouse -f docker-compose.warehouse.yml run --rm warehouse-context
  warehouse-context:
    build:
      context: ./warehouse_navigator
    restart: "no"
    command: ["python", "/opt/scripts/publish_warehouse_context.py", "--no-doc"]
    environment:
      WAREHOUSE_POSTGRES_HOST: neolab-warehouse-db
      WAREHOUSE_POSTGRES_PORT: "5432"
      WAREHOUSE_POSTGRES_DB: ${WAREHOUSE_POSTGRES_DB:-neolab_warehouse}
      WAREHOUSE_POSTGRES_USER: ${WAREHOUSE_POSTGRES_USER:-neolab}
      WAREHOUSE_POSTGRES_PASSWORD: ${WAREHOUSE_POSTGRES_PASSWORD:?set WAREHOUSE_POSTGRES_PASSWORD in .env.warehouse}
    volumes:
      - ./scripts:/opt/scripts:ro
    depends_on:
      neolab-warehouse-db:
        condition: service_healthy

  warehouse-navigator:
    build:
      context: ./warehouse_navigator
    container_name: neolab-warehouse-navigator
    restart: unless-stopped
    environment:
      WAREHOUSE_POSTGRES_HOST: neolab-warehouse-db
      WAREHOUSE_POSTGRES_PORT: "5432"
      WAREHOUSE_POSTGRES_DB: ${WAREHOUSE_POSTGRES_DB:-neolab_warehouse}
      WAREHOUSE_POSTGRES_USER: warehouse_navigator
      WAREHOUSE_POSTGRES_PASSWORD: ${WAREHOUSE_NAVIGATOR_PASSWORD:?set WAREHOUSE_NAVIGATOR_PASSWORD in .env.warehouse}
    ports:
      - "${WAREHOUSE_NAVIGATOR_PORT:-8090}:8090"
    depends_on:
      neolab-warehouse-db:
        condition: service_healthy
    volumes:
      - ./shared_data/geo/zones_registry.geojson:/data/zones_registry.geojson:ro

volumes:
  neolab_warehouse_pgdata:
    name: neolab_warehouse_pgdata
