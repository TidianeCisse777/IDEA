name: Navigator contracts
on:
  push:
    paths: ['warehouse_navigator/**', 'tests/navigator_ui.test.cjs', '.github/workflows/navigator-tests.yml']
  pull_request:
    paths: ['warehouse_navigator/**', 'tests/navigator_ui.test.cjs', '.github/workflows/navigator-tests.yml']
jobs:
  ui-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/navigator_ui.test.cjs
